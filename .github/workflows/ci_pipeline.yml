name : Automatisasi CI Pipeline Capstone

# Trigger: Jalankan CI setiap kali ada push
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pengujian_otomatis:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Mengambil Kode Repositori (Checkout)
      uses: actions/Checkout@v4

    - name: 2. Menyiapkan Environment Python 3.10
      uses: action/setup-python@v5
      with:
        python-version: "3.10"

    - name: 3. Menginstall Depedensi Pustaka
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: 4. Mengeksekusi Unit Testing
      run: |
        pytest tests/